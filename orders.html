<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Orders & Ratings | Crafted Visual</title>
  <link rel="stylesheet" href="styles.css?v=20260607premium">
  <script src="adminAuthGuard.js"></script>
  <script src="translate-ar.js"></script>
  <script src="apiClient.js"></script>
  <link rel="stylesheet" href="responsive-all-devices.css?v=20260607premium" />
  <link rel="stylesheet" href="cv-premium-journey.css?v=20260607premium" />
  <link rel="stylesheet" href="ux95-final-visible.css?v=20260607final2" />
  <link rel="stylesheet" href="final-responsive-admin-mobile.css?v=20260611-final">
</head>
<body>
<header class="nav">
  <div class="brand">Orders & Ratings</div>
  <nav><a href="admin.html">Back to Admin</a><a href="crm.html">CRM</a></nav>
</header>
<main class="admin-wrap">
  <section class="admin-panel">
    <h1>Orders</h1>
    <p>Click a status icon to update and monitor the order.</p>
    <div id="orders"></div>
  </section>
  <section class="admin-panel">
    <h1>Ratings</h1>
    <div id="ratings"></div>
  </section>
</main>
<script>
const statuses = [
  ["New Order","🆕"],["Pending Payment","⏳"],["Paid","💳"],["Confirmed","✅"],["In Production","🛠️"],["Quality Check","🔍"],["Ready for Delivery","📦"],["Out for Delivery","🚚"],["Delivered","🏁"],["Cancelled","❌"]
];
let orders = JSON.parse(localStorage.getItem("orders") || "[]");
function renderOrders(){
  document.getElementById("orders").innerHTML = orders.length ? orders.map((o,idx)=>`
    <div class="review-box order-card">
      <h3>${o.id}</h3>
      <p>${o.customer?.name || ""} | ${o.customer?.mobile || ""} | ${o.customer?.email || ""} | ${o.city || ""}</p>
      <p>${o.address || ""}</p>
      <strong>Total: SAR ${Number(o.total || 0).toLocaleString()}</strong>
      <p>Payment: ${o.paymentStatus || "Pending"} ${o.paymentMethod ? "| " + o.paymentMethod : ""}</p>
      <div class="order-status-icons">
        ${statuses.map(([s,icon])=>`<button type="button" class="${s===(o.orderStatus||"New Order") ? "active" : ""}" onclick="setOrderStatus(${idx}, '${s}')"><span>${icon}</span><small>${s}</small></button>`).join("")}
      </div>
      <label>Follow-Up Note</label>
      <textarea id="note-${idx}" placeholder="Internal note or customer message note"></textarea>
      <button class="btn primary" onclick="saveStatusAndSendCRM(${idx})">Save + Send CRM Update</button>
      <p><strong>Current Status:</strong> ${o.orderStatus || "New Order"}</p>
      <div><h4>Status History</h4>${(o.statusHistory || []).map(h=>`<p><small>${new Date(h.date).toLocaleString()} - ${h.status}${h.note ? " - " + h.note : ""}</small></p>`).join("") || "<p><small>No history yet.</small></p>"}</div>
    </div>
  `).join("") : "<p>No orders yet.</p>";
}
function setOrderStatus(idx,status){
  orders[idx].orderStatus = status;
  orders[idx].updatedAt = new Date().toISOString();
  orders[idx].statusHistory = orders[idx].statusHistory || [];
  orders[idx].statusHistory.push({status, note:"Status icon clicked", date:new Date().toISOString()});
  localStorage.setItem("orders", JSON.stringify(orders));
  renderOrders();
}
function generateMessage(o,note=""){
  return `Dear ${o.customer?.name || "Customer"},\n\nYour Crafted Visual order has been updated.\n\nOrder Number: ${o.id}\nOrder Status: ${o.orderStatus || "New Order"}\nPayment Status: ${o.paymentStatus || "Pending"}\nTotal: SAR ${Number(o.total || 0).toLocaleString()}\n\n${note ? "Note: " + note + "\\n\\n" : ""}Best regards,\nCrafted Visual Customer Care`;
}
function saveStatusAndSendCRM(idx){
  const note = document.getElementById("note-"+idx).value;
  const o = orders[idx];
  o.statusHistory = o.statusHistory || [];
  o.statusHistory.push({status:o.orderStatus || "New Order", note, date:new Date().toISOString()});
  o.customerMessageBody = generateMessage(o,note);
  localStorage.setItem("orders", JSON.stringify(orders));
  const outbox = JSON.parse(localStorage.getItem("crmEmailOutbox") || "[]");
  outbox.push({id:"EMAIL-"+Date.now(), to:o.customer?.email, subject:"Crafted Visual Order Update - "+o.id, body:o.customerMessageBody, status:"Queued", date:new Date().toISOString()});
  localStorage.setItem("crmEmailOutbox", JSON.stringify(outbox));
  const acts = JSON.parse(localStorage.getItem("crmActivities") || "[]");
  acts.push({id:"ACT-"+Date.now(), type:"Order Status Update", payload:{orderId:o.id,status:o.orderStatus,note}, date:new Date().toISOString()});
  localStorage.setItem("crmActivities", JSON.stringify(acts));
  alert("Order update saved and CRM email queued.");
  renderOrders();
}
function renderRatings(){
  const ratings = JSON.parse(localStorage.getItem("ratings") || "{}");
  document.getElementById("ratings").innerHTML = Object.entries(ratings).length ? Object.entries(ratings).map(([id,list])=>{
    const avg = list.reduce((a,b)=>a+b,0)/list.length;
    return `<p><strong>${id}</strong>: ${avg.toFixed(1)} stars (${list.length} ratings)</p>`;
  }).join("") : "<p>No ratings yet.</p>";
}
renderOrders(); renderRatings();
</script>
<script>
function enforcePageWritePermission(section){
  if(typeof cvHasPermission === "function" && !cvHasPermission(section,"write")){
    document.querySelectorAll("button,input,textarea,select").forEach(el=>{
      const text = (el.textContent || el.value || "").toLowerCase();
      if(el.tagName === "A") return;
      el.disabled = true;
    });
    document.body.insertAdjacentHTML("afterbegin", '<div class="read-only-note page-note">Read-only access. You cannot edit this page.</div>');
  }
}
document.addEventListener("DOMContentLoaded", ()=>enforcePageWritePermission('orders'));
</script>
  <script src="responsive-all-devices.js?v=20260607v2"></script>
  <script src="cv-premium-journey.js?v=20260607premium"></script>
  <script src="ux95-final-visible.js?v=20260607final2"></script>
</body>
</html>
