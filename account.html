<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Crafted Visual</title>
  <link rel="stylesheet" href="styles.css?v=20260607premium">
  <link rel="stylesheet" href="customer-journey-95.css?v=20260607v2">
  <script src="translate-ar.js"></script>
  <link rel="stylesheet" href="responsive-all-devices.css?v=20260607premium" />
  <link rel="stylesheet" href="cv-premium-journey.css?v=20260607premium" />

</head>
<body>
<header class="nav">
  <div class="brand">Crafted Visual</div>
  <nav class="simple-page-nav">
    <a href="index.html">Home</a>
    <a href="track-order.html">Track Order</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<main class="account-page">
  <section class="account-card">
    <h1>My Account</h1>
    <p>Manage your saved delivery details.</p>

    <label>Full Name</label>
    <input id="name" placeholder="Full Name">

    <label>Email</label>
    <input id="email" placeholder="Email" readonly>

    <label>Phone Number</label>
    <input id="mobile" placeholder="Phone Number">

    <label>City</label>
    <select id="city"></select>

    <label>Delivery Address</label>
    <textarea id="address" placeholder="Full delivery address"></textarea>

    <label>Building / Villa / Apartment</label>
    <input id="building" placeholder="Building, villa or apartment">

    <label>Additional Notes</label>
    <textarea id="notes" placeholder="Preferred delivery notes"></textarea>

    <div class="account-actions">
      <button class="btn primary" type="button" onclick="saveAccount()">Save Account</button>
      <button class="btn secondary" type="button" onclick="logout()">Logout</button>
    </div>
    <div id="accountStatus" class="admin-save-status"></div>
  </section>

  <section class="account-card">
    <h2>My Orders</h2>
    <div id="myOrders"></div>
  </section>
</main>

<script>
let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
if(!currentUser){ location.href = "auth.html?return=account.html"; }

async function getCities(){
  const local = localStorage.getItem("cms_cities");
  if(local) return JSON.parse(local);
  try { return await fetch("cities.json").then(r=>r.json()); } catch(e){ return ["Riyadh","Jeddah","Dammam","Khobar"]; }
}

async function load(){
  const users = JSON.parse(localStorage.getItem("users") || "[]");
  const saved = users.find(u=>u.email === currentUser.email) || currentUser;
  const cities = await getCities();

  document.getElementById("name").value = saved.name || "";
  document.getElementById("email").value = saved.email || "";
  document.getElementById("mobile").value = saved.mobile || "";
  document.getElementById("address").value = saved.address || "";
  document.getElementById("building").value = saved.building || "";
  document.getElementById("notes").value = saved.notes || "";
  document.getElementById("city").innerHTML = cities.map(c=>`<option ${c === saved.city ? "selected" : ""}>${c}</option>`).join("");

  renderOrders(saved);
}
load();

function saveAccount(){
  const users = JSON.parse(localStorage.getItem("users") || "[]");
  const updated = {
    ...currentUser,
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    mobile: document.getElementById("mobile").value.trim(),
    city: document.getElementById("city").value,
    address: document.getElementById("address").value.trim(),
    building: document.getElementById("building").value.trim(),
    notes: document.getElementById("notes").value.trim()
  };

  const idx = users.findIndex(u=>u.email === updated.email);
  if(idx >= 0) users[idx] = {...users[idx], ...updated};
  else users.push(updated);

  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(updated));
  currentUser = updated;

  const box = document.getElementById("accountStatus");
  box.textContent = "Account saved successfully.";
  box.className = "admin-save-status success";
  renderOrders(updated);
}

function renderOrders(user=currentUser){
  const orders = JSON.parse(localStorage.getItem("orders") || "[]").filter(o => 
    o.customer?.email === user.email || o.customer?.mobile === user.mobile
  );
  document.getElementById("myOrders").innerHTML = orders.length ? orders.map(o=>`
    <div class="review-box">
      <h3>${o.id}</h3>
      <p>Status: ${o.orderStatus || "New Order"}</p>
      <p>Payment: ${o.paymentStatus || "Pending"}</p>
      <strong>Total: SAR ${Number(o.total || 0).toLocaleString()}</strong>
    </div>
  `).join("") : "<p>No orders yet.</p>";
}

function logout(){
  localStorage.removeItem("currentUser");
  location.href = "index.html";
}
</script>
<!-- CV_STATIC_ARABIC_PATCH -->

<script>
(function(){
  const lang = localStorage.getItem('lang') || 'en';
  if(lang !== 'ar') return;
  document.documentElement.lang='ar';
  document.documentElement.dir='rtl';
  const map = {
    'Crafted Visual':'كرافتد فيجوال','Home':'الرئيسية','Shop':'المتجر','My Account':'حسابي','Contact Us':'تواصل معنا','Track Order':'تتبع الطلب',
    'Contact Crafted Visual':'تواصل مع كرافتد فيجوال','For furniture inquiries, custom orders, delivery, after-sales support, and project requests.':'لاستفسارات الأثاث والطلبات الخاصة والتوصيل وخدمة ما بعد البيع وطلبات المشاريع.','Contact Information':'معلومات التواصل','Send Inquiry':'إرسال استفسار','WhatsApp:':'واتساب:','Chat with us':'تواصل معنا','Email:':'البريد الإلكتروني:','Location: Riyadh, Saudi Arabia':'الموقع: الرياض، المملكة العربية السعودية','Working Hours: Saturday to Thursday, 9:00 AM - 9:00 PM':'ساعات العمل: من السبت إلى الخميس، 9:00 صباحاً - 9:00 مساءً','Product Inquiry':'استفسار عن منتج',
    'Track Your Order':'تتبع طلبك','Enter the full order number exactly as received.':'أدخل رقم الطلب الكامل كما وصل إليك.','Track Order':'تتبع الطلب',
    'My Account':'حسابي','Manage your saved delivery details.':'إدارة بيانات التوصيل المحفوظة.','Full Name':'الاسم الكامل','Email':'البريد الإلكتروني','Phone Number':'رقم الجوال','City':'المدينة','Delivery Address':'عنوان التوصيل','Building / Villa / Apartment':'المبنى / الفيلا / الشقة','Additional Notes':'ملاحظات إضافية','Save Account':'حفظ الحساب','Logout':'تسجيل الخروج'
  };
  function walk(node){
    if(node.nodeType===3){
      const t=node.nodeValue.trim();
      if(map[t]) node.nodeValue=node.nodeValue.replace(t,map[t]);
    } else if(node.nodeType===1 && !['SCRIPT','STYLE'].includes(node.tagName)) {
      [...node.childNodes].forEach(walk);
    }
  }
  walk(document.body);
  const ph = {'Full Name':'الاسم الكامل','Mobile Number':'رقم الجوال','Email':'البريد الإلكتروني','Message':'الرسالة','Full Order Number e.g. CV-...':'رقم الطلب الكامل مثال CV-...','Phone Number':'رقم الجوال','Full delivery address':'عنوان التوصيل الكامل','Building, villa or apartment':'المبنى أو الفيلا أو الشقة','Preferred delivery notes':'ملاحظات التوصيل المفضلة'};
  document.querySelectorAll('input,textarea').forEach(el=>{ if(ph[el.placeholder]) el.placeholder=ph[el.placeholder]; });
  document.querySelectorAll('select option').forEach(o=>{ if(map[o.textContent.trim()]) o.textContent=map[o.textContent.trim()]; });
})();
</script>
