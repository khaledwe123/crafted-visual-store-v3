<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Sign In | Crafted Visual</title>
  <link rel="stylesheet" href="styles.css?v=20260607premium">
  <script src="translate-ar.js"></script>
  <script src="apiClient.js"></script>
  <link rel="stylesheet" href="responsive-all-devices.css?v=20260607premium" />
  <link rel="stylesheet" href="cv-premium-journey.css?v=20260607premium" />
  <link rel="stylesheet" href="final-responsive-admin-mobile.css?v=20260611-final">
</head>
<body>
<header class="nav">
  <div class="brand">Crafted Visual</div>
  <nav><a href="index.html">Home</a><a href="contact.html">Contact Us</a></nav>
</header>

<main class="auth-page">
  <section class="auth-card">
    <h1 id="formTitle">Sign In</h1>

    <div class="auth-tabs">
      <button type="button" id="tabSignIn" data-auth-mode="signin" class="active">Sign In</button>
      <button type="button" id="tabSignUp" data-auth-mode="signup">Sign Up</button>
      <button type="button" id="tabForgot" data-auth-mode="forgot">Forgot Password</button>
    </div>

    <div id="signupFields" style="display:none">
      <input id="name" placeholder="Full Name">
      <input id="mobile" placeholder="Mobile Number">
    </div>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <div id="forgotHelp" style="display:none">
      <p>Enter your email and solve the captcha. A password reset request will be saved in CRM.</p>
    </div>

    <div class="captcha-box">
      <label id="captchaQuestion"></label>
      <input id="captchaAnswer" placeholder="Captcha answer">
      <button type="button" class="btn secondary" id="refreshCaptchaBtn">Refresh Captcha</button>
    </div>

    <button class="btn primary" id="submitBtn">Sign In</button>
    <div id="authStatus" class="admin-save-status"></div>
  </section>
</main>

<script>
let mode = "signin";
let captchaResult = 0;

function returnUrl(){
  const p = new URLSearchParams(location.search);
  return p.get("return") || "index.html";
}

function generateCaptcha(){
  const a = Math.floor(Math.random()*8)+2;
  const b = Math.floor(Math.random()*8)+2;
  captchaResult = a + b;
  document.getElementById("captchaQuestion").textContent = `Captcha: ${a} + ${b} = ?`;
  document.getElementById("captchaAnswer").value = "";
}
generateCaptcha();

function validateCaptcha(){
  return Number(document.getElementById("captchaAnswer").value) === captchaResult;
}

function showStatus(msg, error=false){
  const box = document.getElementById("authStatus");
  box.textContent = msg;
  box.className = "admin-save-status " + (error ? "error" : "success");
}

function showMode(next){
  mode = next;
  document.querySelectorAll(".auth-tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("tabSignIn").classList.toggle("active", mode==="signin");
  document.getElementById("tabSignUp").classList.toggle("active", mode==="signup");
  document.getElementById("tabForgot").classList.toggle("active", mode==="forgot");

  document.getElementById("signupFields").style.display = mode === "signup" ? "" : "none";
  document.getElementById("password").style.display = mode === "forgot" ? "none" : "";
  document.getElementById("forgotHelp").style.display = mode === "forgot" ? "" : "none";

  document.getElementById("formTitle").textContent = mode === "signin" ? "Sign In" : mode === "signup" ? "Sign Up" : "Forgot Password";
  document.getElementById("submitBtn").textContent = mode === "signin" ? "Sign In" : mode === "signup" ? "Create Account" : "Request Password Reset";
  generateCaptcha();
}

function getUsers(){ return JSON.parse(localStorage.getItem("users") || "[]"); }
function saveUsers(users){ localStorage.setItem("users", JSON.stringify(users.map(u=>({name:u.name,email:u.email,mobile:u.mobile,addresses:u.addresses||[],createdAt:u.createdAt})))); }
function validEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

async function submitAuth(){
  if(!validateCaptcha()){
    showStatus("Captcha is incorrect.", true);
    generateCaptcha();
    return;
  }

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if(mode === "signup"){
    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    if(!name || !mobile || !validEmail(email) || !password){ showStatus("Please fill all required fields with a valid email.", true); return; }
    if(password.length < 8){ showStatus("Password must be at least 8 characters.", true); return; }
    try{
      if(window.CV_API && await CV_API.available()){
        await CV_API.customerRegister({name,email,mobile,password});
      } else {
        showStatus("Online sign up is temporarily unavailable. Please try again later.", true);
        return;
      }
      location.href = returnUrl();
    }catch(err){ showStatus(err.message || "Sign up failed.", true); }
    return;
  }

  if(mode === "signin"){
    if(!validEmail(email) || !password){ showStatus("Please enter your email and password.", true); return; }
    try{
      if(window.CV_API && await CV_API.available()){
        await CV_API.customerLogin(email,password);
      } else {
        showStatus("Online sign in is temporarily unavailable. Please try again later.", true);
        return;
      }
      location.href = returnUrl();
    }catch(err){ showStatus(err.message || "Invalid email or password.", true); }
    return;
  }

  if(mode === "forgot"){
    if(!validEmail(email)){ showStatus("Please enter a valid email.", true); return; }
    try{
      if(window.CV_API && await CV_API.available()){
        await CV_API.forgotPassword(email);
        showStatus("If this email exists, customer care will contact you.");
      } else {
        showStatus("Online password reset is temporarily unavailable. Please try again later.", true);
      }
    }catch(err){ showStatus(err.message || "Password reset request failed.", true); }
    return;
  }
}

document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll("[data-auth-mode]").forEach(function(btn){
    btn.addEventListener("click", function(){ showMode(btn.getAttribute("data-auth-mode")); });
  });
  const refreshBtn = document.getElementById("refreshCaptchaBtn");
  if(refreshBtn) refreshBtn.addEventListener("click", generateCaptcha);
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn) submitBtn.addEventListener("click", submitAuth);
});
</script>

<script>
(function(){
  const lang = localStorage.getItem('lang') || 'en';
  if(lang !== 'ar') return;
  document.documentElement.lang='ar';
  document.documentElement.dir='rtl';
  const map = {
    'Crafted Visual':'كرافتد فيجوال','Home':'الرئيسية','Shop':'المتجر','My Account':'حسابي','Contact Us':'تواصل معنا','Track Order':'تتبع الطلب',
    'Contact Crafted Visual':'تواصل مع كرافتد فيجوال','For furniture inquiries, custom orders, delivery, after-sales support, and project requests.':'لاستفسارات الأثاث والطلبات الخاصة والتوصيل وخدمة ما بعد البيع وطلبات المشاريع.','Contact Information':'معلومات التواصل','Send Inquiry':'إرسال استفسار','WhatsApp:':'واتساب:','Chat with us':'تواصل معنا','Email:':'البريد الإلكتروني:','Location: Riyadh, Saudi Arabia':'الموقع: الرياض، المملكة العربية السعودية','Working Hours: Saturday to Thursday, 9:00 AM - 9:00 PM':'ساعات العمل: من السبت إلى الخميس، 9:00 صباحاً - 9:00 مساءً','Product Inquiry':'استفسار عن منتج',
    'Track Your Order':'تتبع طلبك','Enter the full order number exactly as received.':'أدخل رقم الطلب الكامل كما وصل إليك.','Track Order':'تتبع الطلب',
    'My Account':'حسابي','Manage your saved delivery details.':'إدارة بيانات التوصيل المحفوظة.','Full Name':'الاسم الكامل','Email':'البريد الإلكتروني','Phone Number':'رقم الجوال','City':'المدينة','Delivery Address':'عنوان التوصيل','Building / Villa / Apartment':'المبنى / الفيلا / الشقة','Additional Notes':'ملاحظات إضافية','Save Account':'حفظ الحساب','Logout':'تسجيل الخروج'
  };
  function walk(node){
    if(node.nodeType===3){
      const t=node.nodeValue.trim();
      if(map[t]) node.nodeValue=node.nodeValue.replace(t,map[t]);
    } else if(node.nodeType===1 && !['SCRIPT','STYLE'].includes(node.tagName)) {
      [...node.childNodes].forEach(walk);
    }
  }
  walk(document.body);
  const ph = {'Full Name':'الاسم الكامل','Mobile Number':'رقم الجوال','Email':'البريد الإلكتروني','Message':'الرسالة','Full Order Number e.g. CV-...':'رقم الطلب الكامل مثال CV-...','Phone Number':'رقم الجوال','Full delivery address':'عنوان التوصيل الكامل','Building, villa or apartment':'المبنى أو الفيلا أو الشقة','Preferred delivery notes':'ملاحظات التوصيل المفضلة'};
  document.querySelectorAll('input,textarea').forEach(el=>{ if(ph[el.placeholder]) el.placeholder=ph[el.placeholder]; });
  document.querySelectorAll('select option').forEach(o=>{ if(map[o.textContent.trim()]) o.textContent=map[o.textContent.trim()]; });
})();
</script>
