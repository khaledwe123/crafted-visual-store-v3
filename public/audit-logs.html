<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | Crafted Visual CMS</title>
  <link rel="stylesheet" href="styles.css?v=20260611-security-hardening">
  <link rel="stylesheet" href="responsive-all-devices.css?v=20260611-security-hardening">
  <script src="adminAuthGuard.js?v=20260611-security-hardening"></script>
  <script src="apiClient.js?v=20260611-security-hardening"></script>
  <style>
    .audit-wrap{max-width:1180px;margin:0 auto;padding:32px 20px}.audit-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.audit-toolbar input{max-width:420px}.audit-table-wrap{overflow:auto;background:#fff;border:1px solid #eadfce;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.04)}.audit-table{width:100%;border-collapse:collapse;min-width:900px}.audit-table th,.audit-table td{text-align:left;padding:12px 14px;border-bottom:1px solid #f0e7d8;vertical-align:top}.audit-table th{background:#faf6ec;font-weight:800}.audit-pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#0f5132;color:#fff;font-size:12px}.audit-meta{max-width:360px;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#555}@media(max-width:680px){.audit-wrap{padding:18px 12px}.audit-toolbar{display:block}.audit-toolbar input,.audit-toolbar button{width:100%;margin:6px 0}.audit-table th,.audit-table td{padding:10px 8px;font-size:12px}}
  </style>
</head>
<body>
<header class="nav">
  <div class="brand">Crafted Visual CMS</div>
  <nav class="admin-top-nav">
    <a href="admin.html">Admin Panel</a>
    <a href="orders.html">Orders</a>
    <a href="financial-dashboard.html">Financial Dashboard</a>
    <a href="customer-journey-dashboard.html">Customer Journey</a>
    <a href="crm.html">CRM</a>
  </nav>
</header>
<main class="audit-wrap">
  <h1>Audit Logs</h1>
  <p class="admin-note">Review sensitive admin actions including login, admin-user changes, discount changes, media uploads, and assignments.</p>
  <div class="audit-toolbar">
    <input id="auditSearch" placeholder="Search action, entity, metadata..." aria-label="Search audit logs">
    <button id="auditRefresh" class="btn primary" type="button">Refresh Logs</button>
  </div>
  <div id="auditStatus" class="admin-save-status">Loading audit logs...</div>
  <div class="audit-table-wrap">
    <table class="audit-table">
      <thead><tr><th>Date</th><th>Admin ID</th><th>Action</th><th>Entity</th><th>Entity ID</th><th>IP Hash</th><th>Metadata</th></tr></thead>
      <tbody id="auditRows"><tr><td colspan="7">Loading...</td></tr></tbody>
    </table>
  </div>
</main>
<script src="audit-logs.js?v=20260611-security-hardening"></script>
</body>
</html>
